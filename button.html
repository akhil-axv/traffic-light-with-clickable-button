<!doctype html>
<html lang="kaa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive traffic light demonstration.">
  <title>Traffic Light | Interactive Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      background: #f3f5f8; color: #182230;
    }
    main { width: min(100%, 360px); text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 5vw, 2rem); }
    p { color: #586579; }
    .traffic-light {
      width: 156px; margin: 28px auto 20px; padding: 18px;
      display: grid; gap: 14px; border-radius: 28px;
      background: #202733; box-shadow: 0 18px 42px #17203330;
    }
    .light {
      width: 100px; height: 100px; margin: auto; border: 4px solid #ffffff30;
      border-radius: 50%; cursor: pointer; opacity: .36;
      transition: opacity .2s, transform .2s, box-shadow .2s;
    }
    .light:hover { transform: scale(1.04); }
    .light[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 22px currentColor; }
    .red { background: #ed4c4c; color: #ed4c4c; }
    .yellow { background: #f5c542; color: #f5c542; }
    .green { background: #2eb872; color: #2eb872; }
    #status {
      min-height: 52px; display: grid; place-items: center;
      padding: 12px; border-radius: 12px; background: white;
      border: 1px solid #dfe5ed; font-weight: 600;
    }
    button:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Interactive Traffic Light</h1>
    <p>Select a light to change the signal.</p>

    <div class="traffic-light" role="group" aria-label="Traffic light controls">
      <button class="light red" type="button" aria-label="Red light" aria-pressed="false" data-label="Stop"></button>
      <button class="light yellow" type="button" aria-label="Yellow light" aria-pressed="false" data-label="Wait"></button>
      <button class="light green" type="button" aria-label="Green light" aria-pressed="false" data-label="Go"></button>
    </div>

    <p id="status" role="status" aria-live="polite">No signal selected</p>
  </main>

  <script>
    const lights = document.querySelectorAll(".light");
    const status = document.getElementById("status");

    lights.forEach((light) => {
      light.addEventListener("click", () => {
        lights.forEach((item) => item.setAttribute("aria-pressed", "false"));
        light.setAttribute("aria-pressed", "true");
        status.textContent = light.dataset.label;
      });
    });
  </script>
</body>
</html>
